version: '3.8'

services:
  # Frontend React Application
  frontend:
    build: ./frontend
    container_name: user-app-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network
    environment:
      - REACT_APP_API_URL=""
      - WDS_SOCKET_PORT=0
    volumes:
      - /nginx-cache:/var/cache/nginx
      - /nginx-run:/var/run/nginx
      

  # Backend Node.js Application
  backend:
    build: ./backend
    container_name: user-app-backend
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis-node-0: # Only need to depend on one node, as it handles init
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MYSQL_HOST=mysql
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=userdb
      - REDIS_NODES=redis-node-0:6379,redis-node-1:6379,redis-node-2:6379,redis-node-3:6379,redis-node-4:6379,redis-node-5:6379
      - REDIS_PASSWORD=bitnami123
    networks:
      - app-network
      - redis-cluster
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5 

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: user-app-mysql
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=userdb
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cluster Nodes
  # --- Redis Cluster Nodes (Now Automated) ---
  x-redis-node-config: &redis-node-config
  image: bitnami/redis:7.2.4
  networks:
    - redis-cluster
  environment:
    # --- Core Bitnami Cluster Configuration ---
    - REDIS_MODE=cluster
    - REDIS_CLUSTER_REPLICAS=1
    - REDIS_NODES=redis-node-0 redis-node-1 redis-node-2 redis-node-3 redis-node-4 redis-node-5
    - REDIS_PASSWORD=bitnami123
    # --- Recommended for Docker Networking ---
    - REDIS_CLUSTER_ANNOUNCE_HOSTNAME=yes # Announce using the container name

  redis-node-0:
    <<: *redis-node-config # Use the anchor
    container_name: redis-node-0
    ports:
      - "7000:6379"
    volumes:
      - redis-data-0:/bitnami/redis/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "localhost", "-a", "bitnami123", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  redis-node-1:
    <<: *redis-node-config
    container_name: redis-node-1
    ports:
      - "7001:6379"
    volumes:
      - redis-data-1:/bitnami/redis/data

  redis-node-2:
    <<: *redis-node-config
    container_name: redis-node-2
    ports:
      - "7002:6379"
    volumes:
      - redis-data-2:/bitnami/redis/data

  redis-node-3:
    <<: *redis-node-config
    container_name: redis-node-3
    ports:
      - "7003:6379"
    volumes:
      - redis-data-3:/bitnami/redis/data

  redis-node-4:
    <<: *redis-node-config
    container_name: redis-node-4
    ports:
      - "7004:6379"
    volumes:
      - redis-data-4:/bitnami/redis/data

  redis-node-5:
    <<: *redis-node-config
    container_name: redis-node-5
    ports:
      - "7005:6379"
    volumes:
      - redis-data-5:/bitnami/redis/data

# --- We NO LONGER NEED the cluster-init service ---

networks:
  app-network:
    driver: bridge
  redis-cluster:
    driver: bridge

volumes:
  mysql-data:
  redis-data-0:
  redis-data-1:
  redis-data-2:
  redis-data-3:
  redis-data-4:
  redis-data-5:
  nginx-cache:
  nginx-run:
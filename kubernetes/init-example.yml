---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: user-app 
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
              - key: "topology.kubernetes.io/zone"
                operator: In
                values: ["us-east-1"]
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: frontend
              topologyKey: "kubernetes.io/hostname"
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values: [backend]
              topologyKey: "kubernetes.io/hostname"

      serviceAccountName: user-app
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001

      # --- Init container to wait for MySQL and Redis ---
      initContainers:
      - name: wait-for-dependencies
        image: busybox:1.35
        command:
          - sh
          - -c
          - |
            echo "Waiting for MySQL..."
            until nc -z "$MYSQL_HOST" 3306; do sleep 2; done
            echo "MySQL is ready!"
            echo "Waiting for Redis..."
            until nc -z "$(echo $REDIS_NODES | cut -d',' -f1 | cut -d':' -f1)" 6379; do sleep 2; done
            echo "Redis is ready!"

        env:
        - name: MYSQL_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MYSQL_HOST
        - name: REDIS_NODES
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_NODES

      containers:
      - name: backend
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: false
        startupProbe:
          httpGet:
            path: /api/health
            port: 5000
            scheme: HTTP
          failureThreshold: 60
          initialDelaySeconds: 10
          periodSeconds: 5
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 30
          failureThreshold: 3
          successThreshold: 1
        image: santoshpalla27/3-tier:backend-2
        ports:
        - containerPort: 5000
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: NODE_ENV 
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: PORT 
        - name: MYSQL_HOST
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MYSQL_HOST 
        - name: MYSQL_USER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MYSQL_USER 
        - name: MYSQL_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MYSQL_PASSWORD 
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: MYSQL_DATABASE 
        - name: REDIS_NODES
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_NODES 
        - name: REDIS_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: REDIS_PASSWORD 
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: user-app 
spec:
  ports:
  - port: 5000
    targetPort: 5000
  selector:
    app: backend
